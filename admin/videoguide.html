<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Videoguide | Dominus Whitelabel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:var(--page-bg-color,#f4ecdf);font-family:var(--font-family,"Avenir Next","Helvetica Neue",Arial,sans-serif);color:var(--text-color,#7f6430)}

.header{padding:40px;text-align:center;border-bottom:1px solid rgba(166,127,52,.12)}
.logo{font-size:26px;font-weight:300;letter-spacing:.35em;color:var(--primary-color,#a67f34);margin-bottom:8px}
.subtitle{font-size:14px;color:#8f7643;max-width:600px;margin:auto;line-height:1.6}

.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:24px 20px 0}
.filter-btn{padding:8px 16px;border:1px solid rgba(166,127,52,.3);background:transparent;color:#8f7643;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:inherit;border-radius:20px}
.filter-btn.active{background:var(--primary-color,#a67f34);color:#fff;border-color:var(--primary-color,#a67f34)}

.container{max-width:1200px;margin:auto;padding:30px 40px 60px}
.package-section{margin-bottom:40px}
.package-title{font-size:20px;font-weight:400;color:var(--primary-color,#a67f34);margin-bottom:4px;padding-bottom:8px;border-bottom:1px solid rgba(166,127,52,.15)}
.package-count{font-size:11.5px;color:#9a8a63;margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:rgba(255,255,255,.35);border:1px solid rgba(166,127,52,.12);overflow:hidden;display:flex;flex-direction:column;position:relative}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,rgba(166,127,52,.15),rgba(166,127,52,.05));display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.thumb video{width:100%;height:100%;object-fit:cover;display:none}
.play-icon{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:var(--primary-color,#a67f34);font-size:20px}
.placeholder-label{position:absolute;bottom:8px;right:8px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:rgba(156,47,47,.85);color:#fff;padding:3px 8px;border-radius:2px}
.card.has-video .placeholder-label{display:none}
.card-body{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.card-title{font-size:14.5px;color:#5c4a20;margin-bottom:6px;font-weight:600}
.card-desc{font-size:12px;color:#9a8a63;line-height:1.5;flex:1}
.card-meta{font-size:10.5px;color:#b0a179;margin-top:10px;text-transform:uppercase;letter-spacing:.04em}

.upcoming-tag{display:inline-block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;background:rgba(166,127,52,.12);color:#8f7643;border-radius:10px;margin-left:6px}

.edit-link-btn{margin-top:10px;align-self:flex-start;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;background:none;border:1px solid rgba(166,127,52,.35);color:#8f7643;padding:5px 10px;cursor:pointer;font-family:inherit;border-radius:3px}
.edit-link-btn:hover{background:rgba(166,127,52,.1)}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-backdrop.open{display:flex}
.modal-video{max-width:900px;width:100%;background:#000;position:relative}
.modal-video video{width:100%;display:block}
.modal-close{position:absolute;top:20px;right:30px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none;z-index:2}

.edit-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:60;padding:20px}
.edit-backdrop.open{display:flex}
.edit-box{background:var(--page-bg-color,#f4ecdf);max-width:420px;width:100%;padding:28px}
.edit-box h3{font-size:15px;color:#5c4a20;margin-bottom:14px}
.edit-box label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8f7643;margin-bottom:5px}
.edit-box input{width:100%;padding:10px;border:1px solid rgba(166,127,52,.25);background:#fff;font-family:inherit;font-size:13px;margin-bottom:14px}
.edit-box .row{display:flex;gap:10px;justify-content:flex-end}
.edit-box button{padding:9px 16px;border:1px solid var(--primary-color,#a67f34);background:var(--primary-color,#a67f34);color:#fff;cursor:pointer;font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-family:inherit}
.edit-box button.secondary{background:transparent;color:#8f7643}
.edit-status{font-size:12px;margin-top:4px;min-height:16px}
.edit-status.error{color:#9c2f2f}
.edit-status.success{color:#4f7f45}
</style>
</head>
<body>

<div class="header">
  <div class="logo">VIDEOGUIDE</div>
  <p class="subtitle">Una guida video per ogni funzione del gestionale — dal caricamento del primo immobile alla generazione di un dossier professionale.</p>
</div>

<div class="filters" id="filters"></div>

<div class="container" id="catalogContainer">
  <p style="text-align:center;color:#9a8a63;padding:40px 0">Caricamento catalogo…</p>
</div>

<div class="modal-backdrop" id="videoModal">
  <button class="modal-close" onclick="closeVideoModal()">&times;</button>
  <div class="modal-video">
    <video id="modalVideoPlayer" controls></video>
    <iframe id="modalVideoFrame" style="display:none;width:100%;aspect-ratio:16/9;border:0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<div class="edit-backdrop" id="editModal">
  <div class="edit-box">
    <h3 id="editTitle">Modifica link video</h3>
    <label>Link video (YouTube o URL .mp4)</label>
    <input type="text" id="editSrcInput" placeholder="https://youtu.be/...">
    <div class="edit-status" id="editStatus"></div>
    <div class="row">
      <button type="button" class="secondary" onclick="closeEditModal()">Annulla</button>
      <button type="button" onclick="saveEditLink()">Salva</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
/* IMPORTANTE: il catalogo videoguide è condiviso da TUTTI i clienti Dominus —
   non è dato per-tenant. Viene letto dalla tabella pubblica
   public.videoguide_catalog. La modifica dei link (pulsante "Modifica link")
   è protetta da RLS lato database: solo l'account super-admin del control
   plane (claudio.romano@bluewin.ch) può salvare — per chiunque altro il
   pulsante resta nascosto e comunque il salvataggio verrebbe rifiutato dal
   database. Non serve più toccare questo file per aggiungere un video: basta
   incollare il link dal pulsante. */

const client = window.supabaseClient;
let CATALOG = [];       // raggruppato per package, popolato da loadCatalog()
let isSuperAdmin = false;
let editingId = null;

function esc(v){ return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function youtubeEmbedUrl(src){
  const short = src.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
  if(short) return `https://www.youtube-nocookie.com/embed/${short[1]}`;
  const long = src.match(/[?&]v=([a-zA-Z0-9_-]+)/);
  if(long) return `https://www.youtube-nocookie.com/embed/${long[1]}`;
  return null;
}

async function checkSuperAdmin(){
  try{
    const { data: { user } } = await client.auth.getUser();
    if(!user) return false;
    const { data } = await client.from("cp_profiles").select("is_super_admin").eq("id", user.id).maybeSingle();
    return !!(data && data.is_super_admin);
  }catch(e){ return false; }
}

async function loadCatalog(){
  const { data, error } = await client
    .from("videoguide_catalog")
    .select("*")
    .order("package_order", { ascending: true })
    .order("item_order", { ascending: true });
  if(error){
    document.getElementById("catalogContainer").innerHTML = '<p style="text-align:center;color:#9c2f2f;padding:40px 0">Errore nel caricamento del catalogo.</p>';
    return;
  }
  const grouped = [];
  const byName = {};
  (data || []).forEach(row => {
    if(!byName[row.package_name]){
      byName[row.package_name] = { package: row.package_name, items: [] };
      grouped.push(byName[row.package_name]);
    }
    byName[row.package_name].items.push(row);
  });
  CATALOG = grouped;
  renderFilters();
  render("Tutti");
}

function render(activePackage){
  const container = document.getElementById("catalogContainer");
  container.innerHTML = CATALOG
    .filter(section => activePackage === "Tutti" || section.package === activePackage)
    .map(section => `
      <div class="package-section">
        <div class="package-title">${esc(section.package)}</div>
        <div class="package-count">${section.items.length} video</div>
        <div class="grid">
          ${section.items.map(item => `
            <div class="card ${item.src ? "has-video" : ""}">
              <div class="thumb" ${item.src ? `onclick="playVideo('${esc(item.src)}')"` : ""}>
                <div class="play-icon">&#9658;</div>
                ${!item.src ? '<div class="placeholder-label">Video in arrivo</div>' : ""}
              </div>
              <div class="card-body">
                <div class="card-title">${esc(item.title)}${item.upcoming ? '<span class="upcoming-tag">Funzione futura</span>' : ""}</div>
                <div class="card-desc">${esc(item.description)}</div>
                <div class="card-meta">${esc(item.duration)}</div>
                ${isSuperAdmin ? `<button type="button" class="edit-link-btn" onclick="openEditModal('${item.id}','${esc(item.title).replace(/'/g,"&#39;")}','${esc(item.src)}')">Modifica link</button>` : ""}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("");
}

function renderFilters(){
  const packages = ["Tutti", ...CATALOG.map(s => s.package)];
  document.getElementById("filters").innerHTML = packages.map((p,i) =>
    `<button class="filter-btn ${i===0?"active":""}" onclick="setFilter('${esc(p)}', this)">${esc(p)}</button>`
  ).join("");
}

window.setFilter = function(pkg, btn){
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render(pkg);
};

window.playVideo = function(src){
  const modal = document.getElementById("videoModal");
  const player = document.getElementById("modalVideoPlayer");
  const frame = document.getElementById("modalVideoFrame");
  const embedUrl = youtubeEmbedUrl(src);
  if(embedUrl){
    player.pause(); player.style.display = "none"; player.src = "";
    frame.style.display = "block";
    frame.src = embedUrl + "?autoplay=1&rel=0";
  }else{
    frame.style.display = "none"; frame.src = "";
    player.style.display = "block";
    player.src = src;
    player.play();
  }
  modal.classList.add("open");
};

window.closeVideoModal = function(){
  const modal = document.getElementById("videoModal");
  const player = document.getElementById("modalVideoPlayer");
  const frame = document.getElementById("modalVideoFrame");
  player.pause();
  player.src = "";
  frame.src = "";
  modal.classList.remove("open");
};

window.openEditModal = function(id, title, currentSrc){
  editingId = id;
  document.getElementById("editTitle").textContent = "Modifica link — " + title;
  document.getElementById("editSrcInput").value = currentSrc || "";
  document.getElementById("editStatus").textContent = "";
  document.getElementById("editModal").classList.add("open");
};

window.closeEditModal = function(){
  document.getElementById("editModal").classList.remove("open");
  editingId = null;
};

window.saveEditLink = async function(){
  if(!editingId) return;
  const status = document.getElementById("editStatus");
  const newSrc = document.getElementById("editSrcInput").value.trim();
  status.className = "edit-status";
  status.textContent = "Salvataggio…";
  const { error } = await client.from("videoguide_catalog").update({ src: newSrc }).eq("id", editingId);
  if(error){
    status.className = "edit-status error";
    status.textContent = "Errore: " + error.message;
    return;
  }
  status.className = "edit-status success";
  status.textContent = "Salvato.";
  await loadCatalog();
  setTimeout(closeEditModal, 500);
};

(async function init(){
  isSuperAdmin = await checkSuperAdmin();
  await loadCatalog();
})();
</script>

</body>
</html>
