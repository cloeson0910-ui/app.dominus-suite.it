<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMINUS Admin — Primo accesso</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}

body{
  overflow:hidden;
  background:var(--page-bg-color,#f4ecdf);
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}

.background{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    var(--page-bg-color,#f4ecdf);
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 0;
}

.card{
  width:440px;
  max-width:90vw;
  padding:52px 46px;
  text-align:center;
  border:1px solid rgba(165,129,57,.18);
  background:rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a58139;
  margin-bottom:12px;
}

.subtitle{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:16px;
}

.intro{
  font-size:13px;
  color:#7f6430;
  line-height:1.6;
  margin-bottom:32px;
}

label{
  display:block;
  text-align:left;
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:15px 16px;
  margin-bottom:18px;
  border:1px solid rgba(165,129,57,.25);
  background:rgba(255,252,244,.35);
  color:var(--text-color,#7f6430);
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:rgba(127,100,48,.55);
}

.password-field{
  position:relative;
  margin-bottom:18px;
}

.password-field input{
  margin-bottom:0;
  padding-right:46px;
}

.toggle-password{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:44px;
  border:none !important;
  background:transparent !important;
  box-shadow:none !important;
  outline:none !important;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a58139;
  padding:0;
  margin:0;
}
.toggle-password svg{ width:19px; height:19px; }

button[type=submit]{
  width:100%;
  margin-top:8px;
  padding:14px 24px;
  border:1px solid rgba(165,129,57,.42);
  background:rgba(255,252,244,.22);
  backdrop-filter:blur(8px);
  color:#a58139;
  text-transform:uppercase;
  font-size:11px;
  font-weight:500;
  letter-spacing:.24em;
  cursor:pointer;
  transition:.3s;
}
button[type=submit]:hover{ background:rgba(255,252,244,.38); }

.error{
  margin-top:18px;
  min-height:18px;
  color:#9c2f2f;
  font-size:13px;
}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
  <div class="card">

    <div class="logo">DOMINUS</div>
    <div class="subtitle">Primo accesso</div>
    <p class="intro">Inserisci le credenziali ricevute via email insieme al codice licenza: attiviamo tutto in un solo passaggio.</p>

    <form id="activateForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Email ricevuta via email" autocomplete="email" required>

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Password ricevuta via email" autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password" aria-label="Mostra password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="licenseCode">Codice licenza</label>
      <input type="text" id="licenseCode" placeholder="es. aB3xQ9..." autocomplete="off" required>

      <button type="submit" id="activateBtn">Attiva e accedi</button>
    </form>

    <div id="error" class="error"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/theme-loader.js"></script>
<script src="../js/site-branding.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const client = window.supabaseClient;

  const form = document.getElementById("activateForm");
  const errorBox = document.getElementById("error");
  const activateBtn = document.getElementById("activateBtn");

  var EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_SLASH = '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.1 3.8M6.2 6.2A13.7 13.7 0 0 0 1 12s4 7 11 7a10.6 10.6 0 0 0 4.2-.85"/>';
  document.querySelectorAll(".toggle-password").forEach(function(btn){
    btn.addEventListener("click", function(){
      var input = document.getElementById(btn.getAttribute("data-target"));
      var svg = btn.querySelector("svg");
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      svg.innerHTML = showing ? EYE_OPEN : EYE_SLASH;
    });
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errorBox.style.color = "#9c2f2f";
    errorBox.textContent = "";
    activateBtn.textContent = "Verifica in corso...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const licenseCode = document.getElementById("licenseCode").value.trim();

    // 1) Login — serve PRIMA di scrivere la licenza, così l'operazione
    //    avviene da utente autenticato (niente più supposizioni su chi
    //    sta chiamando).
    const { data: signInData, error: signInErr } = await client.auth.signInWithPassword({ email, password });
    if(signInErr){
      activateBtn.textContent = "Attiva e accedi";
      errorBox.textContent = "Email o password non corrette: " + signInErr.message;
      return;
    }

    // 2) Il codice licenza dice a quale tenant appartiene questo account
    //    — nessun indovinello su header o sessione.
    const { data: tenantId, error: tenantErr } = await client.rpc("tenant_id_for_license_code", { code: licenseCode });
    if(tenantErr || !tenantId){
      activateBtn.textContent = "Attiva e accedi";
      errorBox.textContent = "Codice licenza non riconosciuto.";
      await client.auth.signOut();
      return;
    }

    // 3) Salva la licenza per quel tenant (prima volta: la crea; se
    //    richiamato di nuovo, aggiorna la stessa riga).
    const { error: licenseErr } = await client.from("immonova_license").upsert(
      { tenant_id: tenantId, license_code: licenseCode },
      { onConflict: "tenant_id" }
    );
    if(licenseErr){
      activateBtn.textContent = "Attiva e accedi";
      errorBox.textContent = "Errore attivazione: " + licenseErr.message;
      return;
    }

    activateBtn.textContent = "Fatto — reindirizzo...";
    window.location.href = "dashboard.html?benvenuto=1";
  });
});
</script>

</body>
</html>
